[project]
name = "verb-scope"
version = "1.0.0"
description = "Ukrainian verb finder and grammatical analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.0",
    "stanza>=1.8.2",
    "torch==2.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
